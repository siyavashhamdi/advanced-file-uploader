<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Uploader</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <main class="shell">
      <header class="brand">
        <p class="logo">Advanced Uploader</p>
        <p class="tagline">
          Pick multiple files — each uploads one by one with live progress.
        </p>
      </header>

      <section class="dropzone" id="dropzone" tabindex="0">
        <input
          type="file"
          id="file-input"
          multiple
          hidden
          aria-label="Select files to upload"
        />
        <div class="dropzone-inner">
          <span class="dropzone-icon" aria-hidden="true"></span>
          <p class="dropzone-title">Drop files here</p>
          <p class="dropzone-hint">or click to browse — multiple selection supported</p>
          <button type="button" class="btn btn-primary" id="browse-btn">
            Choose files
          </button>
        </div>
      </section>

      <section class="queue" id="queue" hidden>
        <div class="queue-head">
          <h2>Upload queue</h2>
          <div class="queue-actions">
            <button type="button" class="btn btn-ghost" id="clear-btn" disabled>
              Clear done
            </button>
            <button type="button" class="btn btn-primary" id="start-btn" disabled>
              Start upload
            </button>
          </div>
        </div>
        <ul class="file-list" id="file-list"></ul>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
