# advanced-file-uploader.neginheal.ir -> 127.0.0.1:3148

upstream advanced_file_uploader {
    server 127.0.0.1:3148;
}

server {
    listen 80;
    listen [::]:80;
    server_name advanced-file-uploader.neginheal.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name advanced-file-uploader.neginheal.ir;

    ssl_certificate /etc/letsencrypt/live/advanced-file-uploader.neginheal.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/advanced-file-uploader.neginheal.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Match app max (10 GB). Streaming avoids buffering huge bodies on disk.
    client_max_body_size 10G;
    client_body_timeout 7200s;
    send_timeout 7200s;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://advanced_file_uploader;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long uploads (still limited by Cloudflare ~100s if proxied/orange-cloud)
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_connect_timeout 60s;
    }
}
